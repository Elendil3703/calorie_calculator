<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>卡路里计算器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录遮罩 -->
  <div id="loginOverlay" class="overlay">
    <div class="overlay-card login-card">
      <h2>🍎 卡路里计算器</h2>
      <p class="muted">登录账号开始记录</p>
      <label>用户
        <select id="loginUser">
          <option value="cj">🇦🇺 CJ</option>
          <option value="katrina">🇨🇳 Katrina</option>
        </select>
      </label>
      <label>密码
        <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" />
      </label>
      <button class="primary-btn" id="loginBtn">登录</button>
      <p class="error-text" id="loginError"></p>
    </div>
  </div>

  <header class="app-header">
    <div class="brand">🍎 卡路里计算器</div>
    <div class="header-right">
      <button id="logoutBtn" class="ghost-btn" title="登出">
        <span id="currentUserBadge">--</span>
        <span class="caret">⏏</span>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="today">今日</button>
    <button class="tab" data-tab="stats">统计</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>

  <main>
    <!-- 今日 -->
    <section id="tab-today" class="tab-panel active">
      <div class="date-line" id="dateLine">--</div>

      <div class="summary-card">
        <div class="summary-row">
          <div class="summary-item">
            <div class="label">已摄入</div>
            <div class="value" id="totalToday">0</div>
            <div class="unit">大卡</div>
          </div>
          <div class="summary-item">
            <div class="label">剩余</div>
            <div class="value" id="remaining">0</div>
            <div class="unit">大卡</div>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 0 大卡</div>
      </div>

      <div id="lastEntryToast" class="last-entry hidden"></div>

      <div class="card">
        <h3>添加食物</h3>
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="direct">直接输入</button>
          <button class="mode-btn" data-mode="quantity">按重量/体积</button>
        </div>

        <div class="mode-panel" id="mode-direct">
          <label>食物名称
            <input type="text" id="d_name" placeholder="如：苹果" />
          </label>
          <div class="row">
            <label class="flex">数值
              <input type="number" id="d_amount" placeholder="例如 250" inputmode="decimal" />
            </label>
            <label>单位
              <select id="d_unit">
                <option value="kcal">大卡 (kcal)</option>
                <option value="kj">千焦 (kJ)</option>
              </select>
            </label>
          </div>
          <button class="primary-btn" id="addDirectBtn">添加</button>
        </div>

        <div class="mode-panel hidden" id="mode-quantity">
          <label>食物名称
            <input type="text" id="q_name" placeholder="如：牛肉" />
          </label>
          <div class="row">
            <label class="flex">摄入量
              <input type="number" id="q_amount" placeholder="例如 300" inputmode="decimal" />
            </label>
            <label>单位
              <select id="q_unit">
                <option value="g">克 (g)</option>
                <option value="ml">毫升 (ml)</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label class="flex">每 100 <span id="q_per_unit">克</span> 含
              <input type="number" id="q_per100" placeholder="例如 250" inputmode="decimal" />
            </label>
            <span class="kcal-suffix">大卡</span>
          </div>
          <div class="preview" id="q_preview">≈ 0 大卡</div>
          <button class="primary-btn" id="addQuantityBtn">添加</button>
        </div>
      </div>

      <div class="card">
        <h3>今日记录</h3>
        <ul class="entry-list" id="entryList">
          <li class="empty">还没有记录，添加第一项吧</li>
        </ul>
      </div>
    </section>

    <!-- 统计 -->
    <section id="tab-stats" class="tab-panel">
      <div class="card">
        <div class="stats-header">
          <h3>历史统计</h3>
          <div class="range-switch">
            <button class="range-btn active" data-range="week">最近 7 天</button>
            <button class="range-btn" data-range="month">最近 30 天</button>
          </div>
        </div>
        <div class="stats-summary" id="statsSummary"></div>
        <div class="chart" id="chart"></div>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </section>

    <!-- 设置 -->
    <section id="tab-settings" class="tab-panel">
      <div class="card">
        <h3>每日摄入阈值</h3>
        <p class="muted">超过该值时进度条会提示。</p>
        <div class="row">
          <label class="flex">
            <input type="number" id="thresholdInput" placeholder="例如 2000" inputmode="decimal" />
          </label>
          <span class="kcal-suffix">大卡</span>
        </div>
        <button class="primary-btn" id="saveThresholdBtn">保存</button>
      </div>

      <div class="card">
        <h3>当前账号</h3>
        <div class="user-name-line" id="settingsUserName">--</div>
        <button class="secondary-btn" id="settingsLogoutBtn">登出</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
